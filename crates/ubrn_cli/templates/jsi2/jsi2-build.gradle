// Generated by uniffi-bindgen-react-native
{%- let package_name = self.config.project.android.package_name() %}
buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath "com.android.tools.build:gradle:8.7.2"
  }
}

apply plugin: "com.android.library"

def getExtOrDefault(name, fallback) {
  return rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

android {
  namespace "{{ package_name }}"
  compileSdkVersion getExtOrDefault("compileSdkVersion", 35)

  defaultConfig {
    minSdkVersion getExtOrDefault("minSdkVersion", 24)
    targetSdkVersion getExtOrDefault("targetSdkVersion", 34)
    // jniLibs/ decides which ABIs ship: `ubrn build jsi2 android` wipes and
    // rewrites it with exactly the ABIs it built. Filtering here would only
    // let a mismatched build silently drop a dlopen target.
  }

  sourceSets {
    main {
      // lib<name>.so per ABI; nothing here is compiled.
      jniLibs.srcDirs = ["{{ self.config.project.android.jni_libs }}"]
    }
  }
}

repositories {
  mavenCentral()
  google()
}

dependencies {
  // The player owns all native code. A missing project here is the earliest
  // sign that @ubjs/react-native is not a direct dependency of the app.
  implementation project(":ubjs_react-native")
  //noinspection GradleDynamicVersion
  implementation "com.facebook.react:react-native:+"
}
{# space #}
