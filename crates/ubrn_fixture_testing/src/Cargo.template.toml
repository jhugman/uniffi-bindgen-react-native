[package]
name = "{{wasm_pkg_name}}"
version = "0.1.0"
authors = ["James Hugman <james@hugman.tv>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]
path = "{{lib_rs_path}}"

[features]
default = ["console_error_panic_hook"]

[dependencies]
# Must match the `wasm-bindgen` binary the tests find on PATH — CI installs
# `WASM_BINDGEN_VERSION`: the rewriter demands version equality, and this
# crate's own [workspace] will not unify them.
wasm-bindgen = "=0.2.114"
{{crate_name}} = { path = "{{crate_path}}" }
uniffi-runtime-javascript = { path = "{{uniffi_runtime_javascript}}", features = ["wasm32"] }
# uniffi_core 0.32.x requires this feature for wasm32 to relax the `Future: Send` bound.
# https://github.com/mozilla/uniffi-rs/issues/2828
uniffi_core = { version = "0.32", features = ["wasm-unstable-single-threaded"] }

# The `console_error_panic_hook` crate provides better debugging of panics by
# logging them with `console.error`. This is great for development, but requires
# all the `std::fmt` and `std::panicking` infrastructure, so isn't great for
# code size when deploying.
console_error_panic_hook = { version = "0.1.7", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"

[workspace]

[workspace.dependencies]
wasm-bindgen = "=0.2.114"
