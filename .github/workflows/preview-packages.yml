name: Preview packages

# Publishes the TypeScript packages from the chosen branch to pkg.pr.new, so a
# consumer can pin them by commit before they reach npm. Manual only: run it
# from the Actions tab, picking the branch. Set napi-targets to preview
# @ubjs/node too: it builds the native module for those targets first.
on:
  workflow_dispatch:
    inputs:
      napi-targets:
        description: "@ubjs/node targets: none, all, or a comma-separated list such as aarch64-apple-darwin,x86_64-unknown-linux-gnu"
        type: string
        default: none

permissions:
  contents: read

jobs:
  napi:
    if: inputs.napi-targets != 'none'
    uses: ./.github/workflows/napi-build.yml
    with:
      targets: ${{ inputs.napi-targets }}

  publish:
    needs: napi
    # With or without @ubjs/node, but not when its build failed.
    if: ${{ !cancelled() && needs.napi.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install pkg-pr-new
        run: yarn install --frozen-lockfile --ignore-scripts

      # The other packages resolve `@ubjs/core` through `typescript/dist`.
      - name: Build @ubjs/core
        run: cd typescript && npm ci && npm run build

      - name: Install @ubjs/wasm
        run: cd runtimes/wasm && npm ci

      - name: Install @ubjs/worker
        if: hashFiles('channels/worker/package.json') != ''
        run: cd channels/worker && npm ci

      - name: Create @ubjs/node package dirs
        if: inputs.napi-targets != 'none'
        run: cd runtimes/napi && npm ci --ignore-scripts && npm run create-npm-dirs

      - name: Download @ubjs/node binaries
        if: inputs.napi-targets != 'none'
        uses: actions/download-artifact@v8
        with:
          path: runtimes/napi/artifacts
          pattern: bindings-*
          merge-multiple: true

      # As the release assembles it, less the targets this run did not build.
      - name: Assemble @ubjs/node
        if: inputs.napi-targets != 'none'
        run: |
          cd runtimes/napi
          npm run artifacts
          for dir in npm/*/; do
            [ "$(basename "$dir")" = root ] && continue
            ls "$dir"*.node > /dev/null 2>&1 || rm -rf "$dir"
          done
          npm run build:ts
          npm run assemble-root

      # pkg-pr-new skips a path that doesn't exist, so a branch without
      # `channels/worker` publishes the other two. Published together, the
      # @ubjs/node packages point at each other's preview URLs.
      - name: "📦 Publish to pkg.pr.new"
        id: publish
        run: |
          napi=()
          [ -d runtimes/napi/npm/root ] && napi=(./runtimes/napi/npm/*/)
          yarn pkg-pr-new publish ./typescript ./runtimes/wasm ./channels/worker "${napi[@]}"

      # Yarn 2+ only treats a URL as a tarball when it ends in `.tgz`, and the
      # URLs pkg.pr.new writes into the packages' own dependencies do not.
      - name: List the install URLs
        env:
          PACKAGES: ${{ steps.publish.outputs.packages }}
        run: |
          {
            echo "### Preview packages for \`$GITHUB_REF_NAME\`"
            echo
            resolutions=()
            for p in $PACKAGES; do
              name="${p%%@https://*}"
              url="${p#"$name@"}.tgz"
              echo "- \`$name\`: $url"
              resolutions+=("    \"$name\": \"$url\"")
            done
            echo
            echo "Under Yarn 2+, add these to the app's \`package.json\`:"
            echo
            echo '```json'
            echo '  "resolutions": {'
            (IFS=$'\n'; echo "${resolutions[*]}") | sed '$!s/$/,/'
            echo '  }'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
