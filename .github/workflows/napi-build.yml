name: Build @ubjs/node

# The native module for each target, uploaded as `bindings-<target>`. The
# release (napi-publish.yml) builds every target; a preview
# (preview-packages.yml) may build a few.
on:
  workflow_call:
    inputs:
      targets:
        description: "all, or a comma-separated list of Rust targets"
        type: string
        default: all

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  matrix:
    name: Choose targets
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      # macOS targets both cross-compile from Apple Silicon runners; Linux
      # targets build with zig.
      - id: pick
        env:
          TARGETS: ${{ inputs.targets }}
        run: |
          all='[
            {"target": "x86_64-apple-darwin", "runner": "macos-latest"},
            {"target": "aarch64-apple-darwin", "runner": "macos-latest"},
            {"target": "x86_64-unknown-linux-gnu", "runner": "ubuntu-latest", "build-flags": "--zig"},
            {"target": "aarch64-unknown-linux-gnu", "runner": "ubuntu-latest", "build-flags": "--zig"},
            {"target": "x86_64-unknown-linux-musl", "runner": "ubuntu-latest", "build-flags": "--zig"},
            {"target": "aarch64-unknown-linux-musl", "runner": "ubuntu-latest", "build-flags": "--zig"},
            {"target": "x86_64-pc-windows-msvc", "runner": "windows-latest"},
            {"target": "aarch64-pc-windows-msvc", "runner": "windows-latest"}
          ]'
          include=$(jq -c --arg t "$TARGETS" '
            ($t | gsub("\\s"; "") | split(",")) as $want
            | map(select($t == "all" or (.target | IN($want[]))))' <<<"$all")
          if [ "$include" = "[]" ]; then
            echo "::error::no known target in '$TARGETS'"
            exit 1
          fi
          echo "include=$include" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: runtimes/napi
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # Pinned, not `stable`. rustc 1.98.0 passes `--fix-cortex-a53-843419`
      # to the linker for aarch64 targets, and the zig linker shim that
      # @napi-rs/cli 2.x generates rejects it, so both aarch64 Linux builds
      # fail and the publish job never runs. 1.97.1 does not pass the flag.
      # Unpin once @napi-rs/cli is upgraded to a version that goes through
      # cargo-zigbuild, which filters the flag.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        if: contains(matrix.build-flags, '--zig')
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild

      - name: Install ziglang
        if: contains(matrix.build-flags, '--zig')
        uses: mlugg/setup-zig@v2

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build native module
        run: npm run build -- --target ${{ matrix.target }} ${{ matrix.build-flags }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: runtimes/napi/uniffi-runtime-napi.*.node
          if-no-files-found: error
