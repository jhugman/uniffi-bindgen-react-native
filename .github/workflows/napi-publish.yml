name: Publish @ubjs/node

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing to npm"
        type: boolean
        default: true

defaults:
  run:
    working-directory: runtimes/napi

permissions:
  contents: read
  id-token: write

jobs:
  build:
    uses: ./.github/workflows/napi-build.yml

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Create npm package dirs
        run: npm run create-npm-dirs

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: runtimes/napi/artifacts
          pattern: bindings-*
          merge-multiple: true

      - name: Move artifacts into npm dirs
        run: npm run artifacts

      - name: Build TypeScript helpers
        run: npm run build:ts

      - name: Assemble root package
        run: npm run assemble-root

      - name: List packages
        run: |
          ls -la npm/*/
          for dir in npm/*/; do
            echo "--- $dir ---"
            cat "$dir/package.json"
            echo ""
          done

      - name: "📦 npm publish: @ubjs/node (dry-run)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          echo "::notice::DRY RUN — not publishing to npm"
          for dir in npm/*/; do
            echo "--- Publishing $dir (dry-run) ---"
            (cd "$dir" && npm publish --dry-run --access public --tag latest)
          done

      - name: "📦 npm publish: @ubjs/node platform packages"
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        run: |
          for dir in npm/*/; do
            [ "$(basename "$dir")" = "root" ] && continue
            echo "--- Publishing $dir ---"
            (cd "$dir" && npm publish --access public --tag latest)
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: "📦 npm publish: @ubjs/node"
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        working-directory: runtimes/napi/npm/root
        run: npm publish --provenance --access public --tag latest
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
