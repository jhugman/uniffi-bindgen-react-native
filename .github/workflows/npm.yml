name: Publish uniffi-bindgen-react-native to npmjs
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Run without publishing to npm"
        type: boolean
        default: true

jobs:
  publish-ubrn:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
      - run: npm install
      - run: cd typescript && npm install && npm run build

      - name: "📦 npm publish: uniffi-bindgen-react-native (dry-run)"
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        run: |
          echo "::notice::DRY RUN — not publishing to npm"
          npm publish --dry-run --access public

      - name: "📦 npm publish: uniffi-bindgen-react-native"
        if: ${{ github.event_name == 'release' || !inputs.dry-run }}
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
