name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: 🔍 Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Install yarn
        run: cargo xtask bootstrap yarn

      - name: Check Typescript format
        run: cargo xtask fmt --check typescript

      - name: Check Rust format
        run: cargo xtask fmt --check rust

  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --verbose

  unit-tests:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests
        run: cargo test --verbose --workspace --exclude 'uniffi-example-*' --exclude 'uniffi-fixture-*' --exclude 'javascript-runtime-tests'

      - name: Run tests for binaries
        run: cargo test --bins

  integration-tests-jsi-bindings:
    name: 🧩 Integration tests (JSI bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling for building C++
        run: sudo apt-get install -y cmake ninja-build

      - name: Installing hermes and test-runner
        run: |
          cargo xtask bootstrap hermes --branch rn/0.77-stable
          cargo xtask bootstrap

      - name: Run tests of generated JSI bindings
        run: "cargo test -- jsi::"

  integration-tests-wasm-bindings:
    name: 🧩 Integration tests (WASM bindings)
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Installing
        run: cargo xtask bootstrap yarn

      - name: Installing WASM
        run: rustup target add wasm32-unknown-unknown

      - name: Installing wasm-bindgen
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked

      - name: Run tests of generated WASM bindings
        run: "cargo test -- wasm::"

  integration-tests-wasm2-bindings:
    name: 🧩 Integration tests (WASM2 player bindings)
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installing
        run: cargo xtask bootstrap yarn

      - name: Installing WASM
        run: rustup target add wasm32-unknown-unknown

      - name: Run unit tests of the WASM2 player runtime
        run: cd runtimes/wasm && npm ci && npm test

      - name: Run tests of generated WASM2 bindings
        run: "cargo test -- wasm2::"

      # Named separately: this test covers the CLI path a consuming project
      # runs rather than the fixture harness, so its name does not match the
      # `wasm2::` filter above. It is `#[ignore]`d so the workspace-wide
      # unit-test job, which installs no wasm32 target, does not run it.
      - name: Run the end-to-end `ubrn build wasm2` test
        run: "cargo test -p uniffi-bindgen-react-native --test wasm2_build -- --ignored"

  integration-tests-napi-runtime:
    name: 🧩 Integration tests (N-API runtime and bindings)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install npm dependencies
        run: cd runtimes/napi && npm ci

      - name: Build napi addon
        run: cd runtimes/napi && npm run build:debug

      - name: Build test fixtures
        run: |
          cargo build -p uniffi-napi-test-lib
          cargo build -p uniffi-fixture-simple

      - name: Build arithmetic example
        run: cargo build -p uniffi-example-arithmetic

      - name: Run runtime tests
        run: cd runtimes/napi && npm test

      - name: Run bootstrap for N-API bindings
        run: cargo xtask bootstrap yarn

      - name: Run tests of generated N-API bindings
        run: "cargo test -- napi::"

  integration-tests-checkout:
    name: 🧩 Integration tests (checkout)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tests for checkout command
        run: ./scripts/run-checkout-tests.sh
