[package]
name = "uniffi-runtime-jsi"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
# staticlib links into the Hermes test-runner's host shim; cdylib is what the
# React Native package ships, one per slice; rlib lets the integration tests
# build a harness against this crate.
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
uniffi-runtime-core = { path = "../core" }
