[package]
name = "uniffi-runtime-jsi"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
# staticlib for host-side linking into the shim; the cdylib for device
# distribution is added in the packaging plan (Plan C). rlib is also produced
# so unit/integration tests can build a test harness against this crate.
crate-type = ["staticlib", "rlib"]

[dependencies]
uniffi-runtime-core = { path = "../core" }
