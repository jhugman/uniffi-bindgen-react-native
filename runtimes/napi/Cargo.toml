[package]
name = "uniffi-runtime-napi"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Node-API 7 for `napi_is_detached_arraybuffer`: a `&[u8]` argument whose buffer
# is detached during argument conversion must be reported as such instead of
# reaching Rust as an empty slice.
napi = { version = "2.16", default-features = false, features = ["napi7"] }
napi-derive = "2.16"
uniffi-runtime-core = { path = "../core" }

[build-dependencies]
napi-build = "2.1"
