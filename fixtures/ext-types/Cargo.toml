[package]
name = "uniffi-fixture-ext-types"
edition = "2021"
version = "0.22.0"
authors = ["Firefox Sync Team <sync-team@mozilla.com>"]
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "ext_types"

[dependencies]
uniffi = { workspace = true }

uniffi-fixture-ext-types-remote = {path = "subcrates/ext-types-remote"}
uniffi-fixture-ext-types-shared = {path = "subcrates/ext-types-shared"}
uniffi-fixture-ext-types-custom = {path = "subcrates/ext-types-custom"}
uniffi-fixture-ext-types-consumer = {path = "subcrates/ext-types-consumer"}

url = "2.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = { workspace = true }
uniffi_core = { workspace = true, features = ["wasm-unstable-single-threaded"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
ubrn_macros = { workspace = true }
ubrn_fixture_testing = { workspace = true }
uniffi = { workspace = true, features = ["bindgen-tests"] }
