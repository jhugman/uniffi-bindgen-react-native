[package]
name = "uniffi-fixture-trait-methods"
version = "0.22.0"
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
name = "uniffi_trait_methods"

[dependencies]
uniffi = { workspace = true }
once_cell = "1.12"
thiserror = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = { workspace = true }
uniffi_core = { workspace = true, features = ["wasm-unstable-single-threaded"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
ubrn_macros = { workspace = true }
ubrn_fixture_testing = { workspace = true }
uniffi = { workspace = true, features = ["bindgen-tests"] }

