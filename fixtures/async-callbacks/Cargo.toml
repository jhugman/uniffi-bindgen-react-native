[package]
name = "uniffi-fixture-async-callbacks"
version = "0.21.0"
authors = ["jhugman"]
edition = "2021"
license = "MPL-2.0"
publish = false

[lib]
name = "async_callbacks"
crate-type = ["lib", "cdylib"]

[dependencies]
uniffi = { workspace = true, features = ["tokio", "cli"] }
async-trait = "0.1"
futures = "0.3"
thiserror = "1.0"
tokio = { version = "1.24.1", features = ["time", "sync"] }
once_cell = "1.18.0"
ubrn_testing = { path = "../../crates/ubrn_testing" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
uniffi-runtime-wasm = { workspace = true }
uniffi_core = { workspace = true, features = ["wasm-unstable-single-threaded"] }

[build-dependencies]
uniffi = { workspace = true, features = ["build"] }

[dev-dependencies]
ubrn_macros = { workspace = true }
ubrn_fixture_testing = { workspace = true }
uniffi = { workspace = true, features = ["bindgen-tests"] }
